[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scsf"
version = "0.1.0"
description = "Spin-adapted selected configuration interaction with native CSF Hamiltonian products"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9"]

[project.optional-dependencies]
test = ["pytest>=7"]
molecule = ["pyscf>=2"]
profile = ["psutil", "threadpoolctl"]

[project.scripts]
scsf = "scsf.drivers.csf_driver:main"
scsf-polarizability = "scsf.drivers.polarizability:cli"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["scsf", "scsf.drivers"]

[tool.pytest.ini_options]
testpaths = ["scsf/test", "benchmarks/slurm_water_scaling"]
